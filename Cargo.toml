[workspace]
members = ["crates/pimp3-core", "crates/pimp3-cli", "crates/pimp3-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DreadpiratePickles/pimp3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
